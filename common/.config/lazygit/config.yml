git:
  # The key is `pagers` — a LIST — on lazygit 0.63 (`lazygit --config` prints
  # the default config, which shows `pagers: []`; older docs say `paging:`, an
  # object). lazygit silently ignores unknown keys, so the wrong shape doesn't
  # error — it just disconnects delta and diffs quietly render as raw git
  # output. Verify against `lazygit --config` output after touching this
  # section, not by eyeballing the YAML.
  #
  # It is due to be renamed again. lazygit's master schema has no `pagers` and
  # no `paging`; it has `git.diffRenderers`, an array whose entries take a
  # `type` ("stdinFilter" | "extDiff" | "rawGit"), an optional `name`, and the
  # same `colorArg`. `pagers` is still correct for every released version —
  # 0.58 prints `pagers: []` in its defaults — so nothing changes here yet.
  # This note exists so the next upgrade does not quietly disconnect delta and
  # leave lazygit rendering raw git output, which is exactly how the yazi
  # configs in this repo came to be silently ignored.
  pagers:
    - colorArg: always # Delta wants colored input; LazyGit handles paging itself
      pager: delta --dark --paging=never --hyperlinks --hyperlinks-file-link-format="lazygit-edit://{path}:{line}"
  parseEmoji: false
promptToReturnFromSubprocess: false
# Two keys used to sit here and neither did anything. `promptToOpenMergeTool`
# is not a lazygit option at all — nothing in its schema has "mergeTool" in the
# name — and `scrollOffBehavior` is real but belongs under `gui`, beside the
# `scrollOffMargin` below that was already in the right place. Both moved or
# removed; see the note on the theme block for how to tell.
os:
  editPreset: nvim
  open: "code --reuse-window {{filename}}"
  openDirInEditor: "code --reuse-window {{dir}}"
  copyToClipboardCmd: "printf '%s' {{text}} | osc-copy"
gui:
  scrollHeight: 32
  scrollPastBottom: false
  scrollOffMargin: 8
  scrollOffBehavior: margin
  nerdFontsVersion: "3"
  showFileIcons: true
  theme:
    # `lightTheme` used to be the first key here and is not one of lazygit's:
    # ThemeConfig has exactly twelve, all of them below. It was inert.
    #
    # `lazygit --config` omits every field with an empty default, so the whole
    # `os:` section is missing from it and looks equally "unknown". That is why
    # the list was originally taken from the schema:
    #
    #   curl -s https://raw.githubusercontent.com/jesseduffield/lazygit/master/schema/config.json
    #
    # It does not apply to this block. All twelve ThemeConfig fields have
    # non-empty defaults, so for `gui.theme` -- the only part of this file that
    # carries colour -- the dump is a complete list of valid names, and
    # tests/check-theme.py now checks these keys against it with no network.
    #
    # Tokyo Night (night) — palette reference: docs/tokyonight.md
    activeBorderColor: ["#7aa2f7", "bold"]
    inactiveBorderColor: ["#292e42"]
    searchingActiveBorderColor: ["#ff9e64", "bold"]
    selectedLineBgColor: ["#283457"]
    inactiveViewSelectedLineBgColor: ["#1f2335"]
    optionsTextColor: ["#e0af68"]
    defaultFgColor: ["#c0caf5"]
    cherryPickedCommitBgColor: ["#3d59a1"]
    cherryPickedCommitFgColor: ["#c0caf5"]
    markedBaseCommitBgColor: ["#ff9e64"]
    markedBaseCommitFgColor: ["#16161e"]
    unstagedChangesColor: ["#f7768e"]
keybinding:
  universal:
    undo: u
customCommands:
  - key: "Z"
    # The date format must be one quoted argument: unquoted, BSD date treats
    # %H:%M:%S as a set-the-clock operand, errors, and the snapshot message
    # gets an empty timestamp.
    command: "sh -c 'id=$(git stash create); if [ -n \"$id\" ]; then git stash store -m \"snapshot $(date \"+%Y-%m-%d %H:%M:%S\")\" \"$id\"; fi'"
    context: "global"
    description: "Stash snapshot (keep worktree)"
  - key: 'Y' # You can change this to any key (e.g., 'C' or '<c-c>')
    context: 'commits, subCommits'
    description: 'Copy diff of selected commit(s) to clipboard'
    command: 'git diff --no-color {{if .SelectedCommitRange}}{{.SelectedCommitRange.From}}^..{{.SelectedCommitRange.To}}{{else}}{{.SelectedLocalCommit.Hash}}^!{{end}} | osc-copy'
