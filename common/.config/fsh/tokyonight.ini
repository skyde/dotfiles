; Tokyo Night (night) for fast-syntax-highlighting.
; Palette reference: docs/tokyonight.md
;
; The command line is the single most-looked-at piece of text on the screen and
; was the last thing here still wearing a stock theme. FSH's default is not
; untidy -- its colour *names* resolve through the terminal's ANSI palette, so
; it was already Tokyo-Night-tinted -- but sixteen slots cannot reach comment
; grey, orange, purple or blue5, so everything muted came out as bright black
; and everything punctuation-ish came out as plain blue.
;
; The structure below is FSH's own default.ini, key for key. What changed is
; the value each key gets, and the roles are taken from the "Used for" column
; of docs/tokyonight.md rather than picked by eye:
;
;   green   #9ece6a  things that will run: commands, builtins, functions
;   magenta #bb9af7  keywords -- the palette's own role for it
;   yellow  #e0af68  strings
;   cyan    #7dcfff  options
;   blue    #7aa2f7  a directory, the same blue it is in ls, lf and yazi
;   purple  #9d7cd8  variables
;   orange  #ff9e64  numbers -- again the palette's own role
;   blue5   #89ddff  punctuation: separators, redirections, globs
;   comment #565f89  comments
;   red     #f7768e  a command that will not run, and arithmetic errors
;
; Two of those are deliberate departures from FSH's defaults rather than
; translations of them:
;
;   - `reserved-word` was yellow, which is also the string colour, so `for` and
;     "for" were the same. Keywords are magenta here, which is what the palette
;     assigns them and what Neovim already paints them.
;   - `path-to-dir` was magenta. A directory is blue in `ls`, in lf, in yazi and
;     in the completion menu; on the command line it is now blue too. The
;     underline stays, because that is the part that means "this exists".
;
; Applied by ~/.zshrc, which runs `fast-theme XDG:tokyonight` when this file is
; newer than the theme FSH has cached -- so editing it is enough, and the cost
; is paid once rather than on every prompt.
;
; Truecolor is safe: FSH's parser accepts #rrggbb, and when the terminal cannot
; do 24-bit it loads zsh/nearcolor and maps each one to the closest 256-colour.

[base]
default          = none
unknown-token    = #f7768e,bold
commandseparator = #89ddff
redirection      = #89ddff
here-string-tri  = #e0af68
here-string-text = bg:#292e42
here-string-var  = #7dcfff,bg:#292e42
exec-descriptor  = #e0af68,bold
comment          = #565f89
correct-subtle   = #7aa2f7
incorrect-subtle = #f7768e
subtle-separator = #3b4261
subtle-bg        = bg:#292e42
secondary        = free

[command-point]
reserved-word     = #bb9af7
subcommand        = #9ece6a
alias             = #9ece6a
suffix-alias      = #9ece6a
global-alias      = bg:#3d59a1
builtin           = #9ece6a
function          = #9ece6a
command           = #9ece6a
precommand        = #9ece6a
hashed-command    = #9ece6a
single-sq-bracket = #9ece6a
double-sq-bracket = #9ece6a
double-paren      = #bb9af7

[paths]
path          = #c0caf5,underline
pathseparator =
path-to-dir   = #7aa2f7,underline
globbing      = #89ddff,bold
globbing-ext  = #bb9af7

[brackets]
; Deliberately none of the colours the code itself uses, so nesting depth stays
; readable against commands, strings and options rather than competing with
; them. The matching pair under the cursor takes the palette's search fill.
paired-bracket  = bg:#3d59a1
bracket-level-1 = #89ddff,bold
bracket-level-2 = #ff9e64,bold
bracket-level-3 = #bb9af7,bold

[arguments]
single-hyphen-option   = #7dcfff
double-hyphen-option   = #7dcfff
back-quoted-argument   = none
single-quoted-argument = #e0af68
double-quoted-argument = #e0af68
dollar-quoted-argument = #e0af68

[in-string]
; A backslash escape or a $substitution *inside* a string: still part of the
; string, but the part that is not literal, so it lifts out of the string
; colour into the one variables and options use.
back-dollar-quoted-argument           = #7dcfff
back-or-dollar-double-quoted-argument = #7dcfff

[other]
variable             = #9d7cd8
assign               = none
assign-array-bracket = #89ddff
history-expansion    = #ff9e64,bold

[math]
mathvar = #9d7cd8
mathnum = #ff9e64
matherr = #f7768e

[for-loop]
forvar  = #9d7cd8
fornum  = #ff9e64
foroper = #89ddff
forsep  = #89ddff,bold

[case]
case-input       = #c0caf5
case-parentheses = #89ddff
case-condition   = bg:#3d59a1
