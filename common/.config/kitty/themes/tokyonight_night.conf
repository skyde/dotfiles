# vim:ft=kitty

## name: Tokyo Night
## license: MIT
## author: Folke Lemaitre
## upstream: https://github.com/folke/tokyonight.nvim/raw/main/extras/kitty/tokyonight_night.conf
##
## Local deviations from upstream (keep wezterm.lua in sync — see docs/tokyonight.md):
##   - cursor is #FF5000, the shared "you are here" orange, not the theme's
##   - color8 is lightened from #414868, which is near-unreadable as bright black


background #1a1b26
foreground #c0caf5
selection_background #2e3c64
selection_foreground #c0caf5
url_color #73daca
cursor #FF5000
cursor_text_color #000000

# Tabs
active_tab_background #7aa2f7
active_tab_foreground #16161e
active_tab_font_style bold
inactive_tab_background #292e42
inactive_tab_foreground #545c7e
inactive_tab_font_style normal
tab_bar_background #15161e
tab_bar_margin_color #15161e

# Windows
active_border_color #7aa2f7
inactive_border_color #292e42
bell_border_color #e0af68
visual_bell_color #292e42

# Marks (kitty's `show_scrollback` / `kitten hints` highlighting)
mark1_foreground #1a1b26
mark1_background #7aa2f7
mark2_foreground #1a1b26
mark2_background #bb9af7
mark3_foreground #1a1b26
mark3_background #7dcfff

# normal
color0 #1d202f
color1 #f7768e
color2 #9ece6a
color3 #e0af68
color4 #7aa2f7
color5 #bb9af7
color6 #7dcfff
color7 #a9b1d6

# bright
color8  #85899C
color9  #ff899d
color10 #9fe044
color11 #faba4a
color12 #8db0ff
color13 #c7a9ff
color14 #a4daff
color15 #c0caf5

# extended colors
color16 #ff9e64
color17 #db4b4b
