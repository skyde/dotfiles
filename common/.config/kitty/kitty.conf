shell /bin/zsh

include themes/tokyonight_night.conf

# Keep the background black instead of the theme's default
# background #000000

# Make faint/dim text closer to VS Code (reduce heavy dimming)
dim_opacity 0.25

font_size 16.0

# Use JetBrainsMono Nerd Font with ligatures enabled
font_family JetBrainsMono Nerd Font
bold_font JetBrainsMono Nerd Font Bold
italic_font JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic
disable_ligatures never

# Quality of life improvements
scrollback_lines 1000000
enable_audio_bell no
confirm_os_window_close 0
macos_option_as_alt yes
cursor_blink_interval 0

# Clipboard shortcuts
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# Allow remote programs to set the clipboard
clipboard_control write-clipboard write-primary no-append

# Make Ctrl+Backspace delete the previous word (send Ctrl+W)
map ctrl+backspace send_text all \x17

# Unmap cmd+t which is used to close terminal in VSCode from doing anything
map cmd+t no_op

# Free up cmd+r (kitty's default start_resizing_window) for other shortcuts.
# Window resizing is still available on kitty's default ctrl+shift+r.
map cmd+r no_op

# Make forward & back shortcuts work in NVim.
# These need send_key: `ctrl-o` is not a kitty action, and kitty drops unknown
# actions without complaining, so the old form was a silent no-op.
map cmd+left send_key ctrl+o
# Forward cannot use ctrl+i: Ctrl+I and Tab are the same key to Neovim (even in
# the kitty keyboard protocol), and normal-mode <Tab> is mapped to indent, so
# ctrl+i indents instead of jumping. Shift+F9 is the one free macro slot.
map cmd+right send_key shift+f9

# Map Cmd+S and Cmd+Shift+[] to Shift+Function keys for Neovim
map cmd+s send_key shift+f5
map cmd+shift+[ send_key shift+f1
map cmd+shift+] send_key shift+f12
map shift+enter send_text all \x1b\r
