shell /bin/zsh

include themes/tokyonight_night.conf

# Keep the background black instead of the theme's default
# background #000000

# Faint text (SGR 2), matched to VS Code's terminal.
#
# The goal was always "closer to VS Code", but the number was going the wrong
# way for it: kitty reads this as an opacity, where one is no dimming and zero
# is invisible, and its own default is 0.4 — so 0.25 was *heavier* dimming than
# stock, and further from VS Code, not closer. xterm.js, which is VS Code's
# terminal, applies exactly `multiplyOpacity(fg, 0.5)` to a dim cell. 0.5 here
# is that same blend.
#
# Nothing in this repo emits SGR 2 any more — delta's diff gutter used to, and
# now names its colours outright, because what dim looks like is the terminal's
# decision and three terminals made three different ones (docs/tokyonight.md,
# "Never `dim` in a diff gutter"). This is for everything else that does.
dim_opacity 0.5

font_size 16.0

# Use JetBrainsMono Nerd Font with ligatures enabled
font_family JetBrainsMono Nerd Font
bold_font JetBrainsMono Nerd Font Bold
italic_font JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic
disable_ligatures never

# Quality of life improvements
scrollback_lines 1000000
enable_audio_bell no
# ...so the bell has to be visible. The theme carries visual_bell_color
# (#292e42, bg_highlight — a darkening rather than a flash), but kitty's
# visual_bell_duration defaults to 0.0, which meant that colour was set and
# never read: a dead key inside the theme file itself. wezterm fades the same
# tint over the same time, since with the sound off it had no bell at all.
visual_bell_duration 0.08
confirm_os_window_close 0
macos_option_as_alt yes
cursor_blink_interval 0

# Clipboard shortcuts
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# Allow remote programs to set the clipboard
clipboard_control write-clipboard write-primary no-append

# Make Ctrl+Backspace delete the previous word (send Ctrl+W)
map ctrl+backspace send_text all \x17

# Unmap cmd+t which is used to close terminal in VSCode from doing anything
map cmd+t no_op

# Free up cmd+r (kitty's default start_resizing_window) for other shortcuts.
# Window resizing is still available on kitty's default ctrl+shift+r.
map cmd+r no_op

# Make forward & back shortcuts work in NVim.
# These need send_key: `ctrl-o` is not a kitty action, and kitty drops unknown
# actions without complaining, so the old form was a silent no-op.
map cmd+left send_key ctrl+o
# Forward cannot use ctrl+i: Ctrl+I and Tab are the same key to Neovim (even in
# the kitty keyboard protocol), and normal-mode <Tab> is mapped to indent, so
# ctrl+i indents instead of jumping. Shift+F9 is the one free macro slot.
map cmd+right send_key shift+f9

# Map Cmd+S and Cmd+Shift+[] to Shift+Function keys for Neovim
map cmd+s send_key shift+f5
map cmd+shift+[ send_key shift+f1
map cmd+shift+] send_key shift+f12
map shift+enter send_text all \x1b\r
