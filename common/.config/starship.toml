# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Inserts a blank line between shell prompts
add_newline = true
command_timeout = 1000
format = "$username$hostname${custom.cloud_workspace}${custom.git_workspace}$directory$git_branch${custom.git_cl}$git_commit$git_state$git_status$cmd_duration\n$character"
right_format = "$time"

# Tokyo Night (night) — palette reference: docs/tokyonight.md
palette = "tokyonight"

[palettes.tokyonight]
bg = "#1a1b26"
bg_highlight = "#292e42"
fg = "#c0caf5"
fg_dark = "#a9b1d6"
comment = "#565f89"
dark3 = "#545c7e"
dark5 = "#737aa2"
red = "#f7768e"
green = "#9ece6a"
yellow = "#e0af68"
blue = "#7aa2f7"
magenta = "#bb9af7"
cyan = "#7dcfff"
orange = "#ff9e64"
purple = "#9d7cd8"
teal = "#1abc9c"

[fill]
symbol = ' '

# Replace the '❯' symbol in the prompt with '➜'
[character] # The name of the module we are configuring is 'character'
success_symbol = '[➜](bold green)'
error_symbol = '[➜](bold red)'

# Disable the package module, hiding it from the prompt completely
[package]
disabled = true

# Show how long each command took to run if it exceeded 1 second
[cmd_duration]
min_time = 1000
show_milliseconds = true

# Default is 'bold cyan'; blue keeps the path from competing with git info.
[directory]
style = 'bold blue'

# Default is 'bold yellow', which collides with cmd_duration.
[username]
style_user = 'bold teal'
style_root = 'bold red'

[line_break]
disabled = true

[time]
disabled = false
format = '[$time ]($style)'
style = 'fg:comment'
use_12hr = true
time_format = '%-I:%M %p'

[git_branch]
format = "on [$symbol$branch]($style) "
symbol = " "
style = "bold magenta"

[git_commit]
disabled = false

[git_state]
disabled = false
style = 'bold orange'

# Deliberately off: computing status means walking the whole worktree, and on
# a Chromium-sized checkout that is seconds per prompt, not milliseconds.
[git_status]
disabled = true

[git_metrics]
disabled = true

[nodejs]
disabled = true

[python]
disabled = true

[rust]
disabled = true

# Every custom module below runs on every prompt, so each one costs its
# processes on every command you type. Two rules keep that cheap:
#
#   1. No `when` where the work can be folded into `command`. Starship runs
#      `when` and then `command` as separate shells, so a module that probes
#      git in both pays for the same probe twice.
#   2. That fold is only safe when the module renders to nothing on empty
#      output — starship does NOT hide a module whose command printed
#      nothing, it renders the format with `$output` empty. So any literal
#      text or spacing in `format` has to move into the command's output,
#      leaving `format` as a bare styled `$output`. Where that is not
#      possible, `when` stays (see git_cl).
#
# `when = true` is required, not decorative: `when` defaults to *false*, so a
# custom module that simply omits it never renders. As a TOML boolean it is
# free — starship reads it directly instead of spawning a shell for it.
#
# Every module pins `shell = ['sh']`. Left unset, starship falls back to
# $STARSHIP_SHELL — i.e. zsh — so each command (and string `when`) spawn paid
# full zsh startup including a .zshenv source, per prompt. The scripts are
# plain POSIX; /bin/sh (dash on Debian) starts in a fraction of the time.

[custom.cloud_workspace]
description = "Cloud workspace name"
shell = ['sh']
when = true
# Pure shell: `case` and parameter expansion are builtins, where the previous
# `echo | grep` gate plus `echo | cut` command spawned four processes.
command = '''
case "$PWD" in
  /google/src/cloud/*/*)
    rest=${PWD#/google/src/cloud/}
    rest=${rest#*/}
    printf '%s ' "${rest%%/*}"
    ;;
esac
'''
format = '[$output]($style)'
style = 'bold purple'

[custom.git_workspace]
description = "Chromium workspace name (chrome/chrome2/etc)"
# Cheap for free: starship knows whether it is in a repo without asking git,
# so outside one the command never runs at all.
require_repo = true
shell = ['sh']
when = true

# Show the parent of the checkout (chrome, chrome2, ...) when the repo root is
# a directory named 'src'. The trailing "/" is printed here rather than sitting
# in `format` so that a non-Chromium repo renders nothing instead of a stray
# slash — which is what lets the gate live in this one git call instead of a
# second identical one in `when`.
command = '''
root=$(git rev-parse --show-toplevel 2>/dev/null) || exit 0
[ "${root##*/}" = "src" ] || exit 0
parent=${root%/*}
printf '%s/' "${parent##*/}"
'''

format = '[$output]($style)'
style  = 'bold cyan'

[custom.git_cl]
description = "Chromium CL number"
# Skipped outright outside a git repo.
require_repo = true
shell = ['sh']
# This one keeps its `when`: `format` wraps $output in the literal "at " and a
# trailing space, so an empty output would render "at  " rather than nothing.
# Folding the gate into `command` would need those literals moved inside it,
# and they are deliberately unstyled while $output is bold blue. A repo where
# some *other* branch has a CL is normal in Chromium, so "repo has any
# gerritissue" is not a usable cheaper gate either.
# Check if the current branch has a gerritissue config
when = """
branch=$(git symbolic-ref --short HEAD 2>/dev/null)
[ -n "$branch" ] && git config branch."$branch".gerritissue >/dev/null 2>&1
"""
# If 'when' passes, we know we have a CL number.
command = """
branch=$(git symbolic-ref --short HEAD)
cl=$(git config branch."$branch".gerritissue)
echo " $cl"
"""
style = "bold blue"
format = "at [$output]($style) "
