# Basic Yazi configuration
# Schema: https://yazi-rs.github.io/schemas/yazi.json

[mgr]
ratio = [1, 4, 7]
show_hidden = true
sort_by = "mtime"
sort_reverse = true

[preview]
wrap = "yes"

# Preview code through bat so the right-hand pane uses the same syntax theme
# (BAT_THEME) and the same custom syntaxes as bat, delta and VS Code.
# See plugins/bat-preview.yazi/main.lua for why this beats mgr.syntect_theme.
[[plugin.prepend_previewers]]
mime = "text/*"
run = "bat-preview"

[[plugin.prepend_previewers]]
mime = "application/{json,xml,javascript,x-javascript,x-sh,x-shellscript,toml,x-yaml,x-toml}"
run = "bat-preview"

# Extensionless dotfiles and anything `file` reports as generic data but that
# is really text (.zshrc, Dockerfile, Makefile, ...). Matching on the name
# also skips the wait for mime detection: a mime-matched previewer can't run
# until `file` has been spawned and has answered, which on the first hover of
# a file is a visible extra beat of blank pane. Common text extensions are
# all listed here so they preview the instant the cursor lands on them.
[[plugin.prepend_previewers]]
url = "*.{zsh,zshrc,bashrc,conf,cfg,ini,lua,rs,go,py,rb,ts,tsx,js,jsx,cs,cpp,hpp,cc,c,h,md,yml,yaml,toml,json,log,txt,csv,tsv,sql,sh,bash,fish,xml,html,css,scss,java,kt,swift,vim,ps1,psm1,patch,diff,env}"
name = "*.{zsh,zshrc,bashrc,conf,cfg,ini,lua,rs,go,py,rb,ts,tsx,js,jsx,cs,cpp,hpp,cc,c,h,md,yml,yaml,toml,json,log,txt,csv,tsv,sql,sh,bash,fish,xml,html,css,scss,java,kt,swift,vim,ps1,psm1,patch,diff,env}"
run = "bat-preview"

