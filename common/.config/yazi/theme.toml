# Tokyo Night (night) for yazi
# Schema: https://yazi-rs.github.io/schemas/theme.json
# Palette reference: docs/tokyonight.md

[mgr]
cwd = { fg = "#7dcfff" }

find_keyword = { fg = "#ff9e64", bold = true }
find_position = { fg = "#bb9af7", bg = "reset", italic = true }

# Yank/cut/select markers: the thin bar down the left of a row
marker_copied = { fg = "#9ece6a", bg = "#9ece6a" }
marker_cut = { fg = "#f7768e", bg = "#f7768e" }
marker_marked = { fg = "#7dcfff", bg = "#7dcfff" }
marker_selected = { fg = "#e0af68", bg = "#e0af68" }

count_copied = { fg = "#16161e", bg = "#9ece6a" }
count_cut = { fg = "#16161e", bg = "#f7768e" }
count_selected = { fg = "#16161e", bg = "#e0af68" }

border_symbol = "│"
border_style = { fg = "#292e42" }

# The hovered row in each column.
#
# These lived in [mgr] as `hovered` and `preview_hovered` until yazi
# v25.12.29 reclassified them here as `current` and `preview` (and split out
# `parent`, which `hovered` used to cover). Renamed keys do not warn — yazi
# silently ignores what it does not recognise, the gotcha further down this
# repo's docs/tokyonight.md — so the old names had quietly stopped doing
# anything and both rows had fallen back to the defaults these settings exist
# to avoid: `reversed` for the hovered row and `underline` for the preview.
# On a yazi older than v25.12.29, put `current` back under [mgr] as `hovered`.
#
# parent and current: the selection blue, not a reverse-video flip, so the
# file icon and git status colours survive underneath the cursor.
#
# preview: yazi's default there is `underline = true`, which cuts a hard rule
# across an unfocused pane. A muted fill is the same gesture as the row above,
# just quieter because that pane is not focused.
[indicator]
parent = { fg = "#c0caf5", bg = "#283457" }
current = { fg = "#c0caf5", bg = "#283457" }
preview = { fg = "#c0caf5", bg = "#292e42" }

[tabs]
active = { fg = "#16161e", bg = "#7aa2f7", bold = true }
inactive = { fg = "#545c7e", bg = "#292e42" }

[mode]
normal_main = { fg = "#16161e", bg = "#7aa2f7", bold = true }
normal_alt = { fg = "#7aa2f7", bg = "#292e42" }

select_main = { fg = "#16161e", bg = "#9ece6a", bold = true }
select_alt = { fg = "#9ece6a", bg = "#292e42" }

unset_main = { fg = "#16161e", bg = "#bb9af7", bold = true }
unset_alt = { fg = "#bb9af7", bg = "#292e42" }

[status]
# The bottom bar sits on the page background rather than a darker strip, so it
# reads as part of the pane instead of a separate chrome band.
overall = { fg = "#c0caf5", bg = "#1a1b26" }

# Permission bits, coloured per column so drwxr-xr-x is scannable at a glance
perm_sep = { fg = "#3b4261" }
perm_type = { fg = "#7aa2f7" }
perm_read = { fg = "#e0af68" }
perm_write = { fg = "#f7768e" }
perm_exec = { fg = "#9ece6a" }

progress_label = { fg = "#c0caf5", bold = true }
progress_normal = { fg = "#7aa2f7", bg = "#292e42" }
progress_error = { fg = "#f7768e", bg = "#292e42" }

[which]
mask = { bg = "#1f2335" }
cand = { fg = "#7dcfff" }
rest = { fg = "#565f89" }
desc = { fg = "#bb9af7" }
separator = "  "
separator_style = { fg = "#3b4261" }

[confirm]
border = { fg = "#7aa2f7" }
title = { fg = "#7aa2f7" }
# `content` until v25.12.29, `body` since.
body = {}
list = { fg = "#7dcfff" }
btn_yes = { fg = "#16161e", bg = "#9ece6a", bold = true }
btn_no = { fg = "#16161e", bg = "#f7768e", bold = true }

[spot]
border = { fg = "#7aa2f7" }
title = { fg = "#7aa2f7" }
tbl_col = { fg = "#7aa2f7", bold = true }
tbl_cell = { fg = "#ff9e64", bg = "#283457" }

[notify]
title_info = { fg = "#9ece6a" }
title_warn = { fg = "#e0af68" }
title_error = { fg = "#f7768e" }

[pick]
border = { fg = "#7aa2f7" }
active = { fg = "#bb9af7", bold = true }
inactive = {}

[input]
border = { fg = "#7aa2f7" }
title = {}
value = {}
selected = { bg = "#283457" }

[cmp]
border = { fg = "#7aa2f7" }
active = { fg = "#bb9af7", bold = true }
inactive = { fg = "#a9b1d6" }

[tasks]
border = { fg = "#7aa2f7" }
title = {}
# Same treatment as preview_hovered: a fill rather than a hard underline.
hovered = { fg = "#bb9af7", bg = "#292e42" }

[help]
on = { fg = "#7dcfff" }
run = { fg = "#bb9af7" }
desc = { fg = "#a9b1d6" }
hovered = { bg = "#283457", bold = true }
footer = { fg = "#16161e", bg = "#c0caf5" }

# Filetype colours. These mirror common/.config/lf/colors so the two file
# managers agree on what a .zip or a broken symlink looks like.
#
# Order matters and follows yazi's own convention: specific mime/url patterns
# first, then the catch-all `is = ...` rules and the directory glob last. The
# valid `is` values are exactly: none, hidden, link, orphan, dummy, block,
# char, fifo, sock, exec, sticky (yazi rejects anything else, including "dir" —
# directories are matched with the glob "*/").
#
# The pattern key is `url`, not `name`: v25.12.29 renamed it across filetype,
# previewer, fetcher and icon rules to make room for virtual filesystems, and
# an unrecognised key here is ignored rather than reported. `mime` patterns are
# unchanged — verified against yazi 26.5.6 that a plain `image/*` still
# matches, so they do not need the `**/` prefix upstream's preset now uses.
[filetype]
rules = [
  # --- archives → red ---
  { url = "*.tar", fg = "#f7768e" },
  { url = "*.tgz", fg = "#f7768e" },
  { url = "*.gz", fg = "#f7768e" },
  { url = "*.bz2", fg = "#f7768e" },
  { url = "*.xz", fg = "#f7768e" },
  { url = "*.zst", fg = "#f7768e" },
  { url = "*.zip", fg = "#f7768e" },
  { url = "*.7z", fg = "#f7768e" },
  { url = "*.rar", fg = "#f7768e" },
  { url = "*.deb", fg = "#f7768e" },
  { url = "*.rpm", fg = "#f7768e" },
  { url = "*.dmg", fg = "#f7768e" },

  # --- media → magenta, audio → purple ---
  { mime = "image/*", fg = "#bb9af7" },
  { mime = "video/*", fg = "#bb9af7" },
  { mime = "audio/*", fg = "#9d7cd8" },

  # --- documents → orange ---
  { mime = "application/pdf", fg = "#ff9e64" },
  { mime = "application/epub+zip", fg = "#ff9e64" },
  # By name rather than mime: DjVu has no registered type most mime
  # databases agree on, so the extension is what lf and LS_COLORS match too.
  { url = "*.djvu", fg = "#ff9e64" },
  { url = "*.docx", fg = "#ff9e64" },
  { url = "*.xlsx", fg = "#ff9e64" },
  { url = "*.pptx", fg = "#ff9e64" },

  # --- source code → green ---
  { url = "*.c", fg = "#9ece6a" },
  { url = "*.h", fg = "#9ece6a" },
  { url = "*.cc", fg = "#9ece6a" },
  { url = "*.cpp", fg = "#9ece6a" },
  { url = "*.hpp", fg = "#9ece6a" },
  { url = "*.cs", fg = "#9ece6a" },
  { url = "*.go", fg = "#9ece6a" },
  { url = "*.rs", fg = "#9ece6a" },
  { url = "*.py", fg = "#9ece6a" },
  { url = "*.rb", fg = "#9ece6a" },
  { url = "*.js", fg = "#9ece6a" },
  { url = "*.ts", fg = "#9ece6a" },
  { url = "*.tsx", fg = "#9ece6a" },
  { url = "*.jsx", fg = "#9ece6a" },
  { url = "*.lua", fg = "#9ece6a" },
  { url = "*.sh", fg = "#9ece6a" },
  { url = "*.zsh", fg = "#9ece6a" },
  { url = "*.bash", fg = "#9ece6a" },
  { url = "*.ps1", fg = "#9ece6a" },

  # --- config and data → yellow ---
  { url = "*.json", fg = "#e0af68" },
  { url = "*.toml", fg = "#e0af68" },
  { url = "*.yaml", fg = "#e0af68" },
  { url = "*.yml", fg = "#e0af68" },
  { url = "*.ini", fg = "#e0af68" },
  { url = "*.conf", fg = "#e0af68" },
  { url = "*.cfg", fg = "#e0af68" },
  { url = "*.xml", fg = "#e0af68" },

  # --- prose → foreground ---
  { url = "*.md", fg = "#c0caf5" },
  { url = "*.txt", fg = "#c0caf5" },
  { url = "*.rst", fg = "#c0caf5" },

  # --- build noise → comment grey ---
  { url = "*.log", fg = "#565f89" },
  { url = "*.bak", fg = "#565f89" },
  { url = "*.tmp", fg = "#565f89" },
  { url = "*.swp", fg = "#565f89" },
  { url = "*.o", fg = "#565f89" },
  { url = "*.pyc", fg = "#565f89" },
  { url = "*.lock", fg = "#565f89" },

  # --- special file kinds, checked after the patterns above ---
  { url = "*", is = "orphan", fg = "#f7768e", bold = true },
  { url = "*", is = "link", fg = "#7dcfff" },
  { url = "*", is = "block", fg = "#e0af68" },
  { url = "*", is = "char", fg = "#e0af68" },
  # Yellow, with the block and char devices above and against the magenta
  # socket below. That is what lf and LS_COLORS say, and what `ls` has said
  # since long before either — pi is yellow, so is magenta.
  { url = "*", is = "fifo", fg = "#e0af68" },
  { url = "*", is = "sock", fg = "#bb9af7" },
  { url = "*", is = "sticky", fg = "#c0caf5", bg = "#7aa2f7" },
  { url = "*", is = "exec", fg = "#9ece6a" },
  { url = "*", is = "dummy", fg = "#565f89" },

  # --- directories, and finally everything else ---
  { url = "*/", fg = "#7aa2f7", bold = true },
  { url = "*", fg = "#c0caf5" },
]
