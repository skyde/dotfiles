# tmux-multi: unified sessions across computers (docs/tmux-multi.md).
#
# Sourced by the real ~/.tmux.conf AND by tmux-multi-demo's sandbox config,
# so the two cannot drift. Assumes the M-a prefix and the tmux-multi script
# at ~/.local/bin/tmux-multi (the demo redirects ssh and the hosts file via
# the server environment, not by editing these bindings).

# s (and S) open the cross-machine session picker, deliberately replacing
# the native session tree so the everyday key shows every machine's
# sessions, not just this one's. N creates a session on a chosen machine.
# Fullscreen: the preview renders real pane captures, which need the room.
bind-key s display-popup -E -w 100% -h 100% "~/.local/bin/tmux-multi pick"
bind-key S display-popup -E -w 100% -h 100% "~/.local/bin/tmux-multi pick"
bind-key N display-popup -E -w 100% -h 100% "~/.local/bin/tmux-multi new"

# Flat view: never show two status bars. When the current window holds a
# remote (tmux-multi) session, this session's own bar hides so the remote
# machine's bar — which lists that machine's windows — is the only one
# visible; selecting a local window brings it back. tmux-multi open sets the
# initial state for freshly created remote windows (the hook would fire
# before the window is tagged).
set-hook -g session-window-changed "set -F status '#{?#{!=:#{@tmux_multi_target},},off,on}'"

# Flat keys: window- and pane-level commands act on the machine you are
# LOOKING at. In a tmux-multi window they forward to the inner tmux (same
# dotfiles, same prefix, on every machine); in a normal window they run
# locally as usual. Session-level keys stay local: s/S/N above, d (detach),
# r (reload) — and ']' pastes the local buffer into the remote pane, which
# is cross-machine paste for free. multi-fwd names the condition once; a
# consequence of per-key dispatch is that the local arms below freeze copies
# of tmux's default bindings.
set -s command-alias[100] "multi-fwd=if-shell -F '#{!=:#{@tmux_multi_target},}'"
bind-key n multi-fwd { send-keys M-a n } { next-window }
bind-key p multi-fwd { send-keys M-a p } { previous-window }
bind-key c multi-fwd { send-keys M-a c } { new-window }
bind-key C multi-fwd { send-keys M-a C } { new-window -a -c "#{pane_current_path}" }
bind-key x multi-fwd { send-keys M-a x } { confirm-before -p "kill-pane #P? (y/n)" kill-pane }
bind-key z multi-fwd { send-keys M-a z } { resize-pane -Z }
bind-key w multi-fwd { send-keys M-a w } { choose-tree -Zw }
bind-key , multi-fwd { send-keys M-a , } { command-prompt -I "#W" { rename-window "%%" } }
bind-key [ multi-fwd { send-keys M-a [ } { copy-mode }
bind-key '"' multi-fwd { send-keys M-a '"' } { split-window }
bind-key % multi-fwd { send-keys M-a % } { split-window -h }
bind-key 0 multi-fwd { send-keys M-a 0 } { select-window -t :=0 }
bind-key 1 multi-fwd { send-keys M-a 1 } { select-window -t :=1 }
bind-key 2 multi-fwd { send-keys M-a 2 } { select-window -t :=2 }
bind-key 3 multi-fwd { send-keys M-a 3 } { select-window -t :=3 }
bind-key 4 multi-fwd { send-keys M-a 4 } { select-window -t :=4 }
bind-key 5 multi-fwd { send-keys M-a 5 } { select-window -t :=5 }
bind-key 6 multi-fwd { send-keys M-a 6 } { select-window -t :=6 }
bind-key 7 multi-fwd { send-keys M-a 7 } { select-window -t :=7 }
bind-key 8 multi-fwd { send-keys M-a 8 } { select-window -t :=8 }
bind-key 9 multi-fwd { send-keys M-a 9 } { select-window -t :=9 }
# Vim-style pane navigation and window juggling, flat-aware like the rest.
bind-key h multi-fwd { send-keys M-a h } { select-pane -L }
bind-key j multi-fwd { send-keys M-a j } { select-pane -D }
bind-key k multi-fwd { send-keys M-a k } { select-pane -U }
bind-key l multi-fwd { send-keys M-a l } { select-pane -R }
bind-key -r '<' multi-fwd { send-keys M-a < } { run-shell 'id=$(tmux display -p "#{window_id}"); tmux swap-window -t:-1; tmux select-window -t "$id"' }
bind-key -r '>' multi-fwd { send-keys M-a > } { run-shell 'id=$(tmux display -p "#{window_id}"); tmux swap-window -t:+1; tmux select-window -t "$id"' }

# For inner-tmux keys outside the forwarded set, double-tap the prefix to
# send one prefix inward (e.g. M-a M-a M-1 applies a layout on the remote).
# Stateless on purpose: a sustained "hand ALL keys inward" mode is an
# invisible trap that silently reroutes every key, prefix s included.
bind-key M-a send-prefix
