# Easy source of config
unbind-key r
bind-key   r  source-file ~/.tmux.conf

# Primary prefix (default)
set -g prefix M-a

# Secondary prefix
set -g prefix2 C-b
bind-key -n S-F10 switch-client -T prefix

# Reduce delay when using Alt-based keys
# We still keep a vsmall delay as Visual Studio Code terminal
# will not interpret color sequences correctly if not set
set -s escape-time 10

# Start windows and panes numbering at 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Increase scrollback history
set -g history-limit 1000000

# Enable mouse support for pane selection, resizing, and scrolling
set -g mouse on

# Needed for kitty on macOS so Option sends proper escape sequences
set -g xterm-keys on

# Make tmux recognise keys modified with Alt/Meta/Shift
set-option -g extended-keys on

# Advertise that xterm-kitty supports extended keys
set-option -g terminal-features 'xterm-kitty:extkeys'

# Enable OSC 52 clipboard integration
set-option -g set-clipboard on
set -as terminal-features ',xterm*:clipboard'

# Optional: double-tap Ctrl-b to send a literal C-b
# bind-key C-b send-prefix

# Use VIM bindings
setw -g mode-keys vi

# Vim style visual mode
bind-key -T copy-mode-vi v send-keys -X begin-selection

# Bind 'C-v' to start block selection (Visual Block)
# This chains 'begin-selection' and 'rectangle-toggle' to start block mode immediately
bind-key -T copy-mode-vi 'C-v' send -X begin-selection \; send -X rectangle-toggle

# Copy selection with "y" in copy mode (same as Enter)
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel
bind-key -T copy-mode    y send -X copy-selection-and-cancel

# Exit copy/edit mode with Escape (useful when tmux captures the key)
bind-key -T copy-mode-vi Escape send -X cancel
bind-key -T copy-mode    Escape send -X cancel

# Jump to start of line in copy mode
bind-key -T copy-mode-vi '_' send -X start-of-line
bind-key -T copy-mode    '_' send -X start-of-line

# Vim bindings for navigation (flat-aware: forwarded inward in a tmux-multi
# window — see the "flat keys" block below)
bind-key h if-shell -F '#{!=:#{@tmux_multi_target},}' { send-keys M-a h } { select-pane -L }
bind-key j if-shell -F '#{!=:#{@tmux_multi_target},}' { send-keys M-a j } { select-pane -D }
bind-key k if-shell -F '#{!=:#{@tmux_multi_target},}' { send-keys M-a k } { select-pane -U }
bind-key l if-shell -F '#{!=:#{@tmux_multi_target},}' { send-keys M-a l } { select-pane -R }

# Scroll 16 lines at a time (matches VS Code Shift+F4/Shift+F6 macros) while in copy mode
bind-key -T copy-mode-vi S-F4 send-keys -X -N 16 scroll-up
bind-key -T copy-mode-vi S-F6 send-keys -X -N 16 scroll-down
bind-key -T copy-mode S-F4 send-keys -X -N 16 scroll-up
bind-key -T copy-mode S-F6 send-keys -X -N 16 scroll-down

bind-key -r '<' if-shell -F '#{!=:#{@tmux_multi_target},}' { send-keys M-a < } { run-shell 'id=$(tmux display -p "#{window_id}"); tmux swap-window -t:-1; tmux select-window -t "$id"' }
bind-key -r '>' if-shell -F '#{!=:#{@tmux_multi_target},}' { send-keys M-a > } { run-shell 'id=$(tmux display -p "#{window_id}"); tmux swap-window -t:+1; tmux select-window -t "$id"' }
bind-key C if-shell -F '#{!=:#{@tmux_multi_target},}' { send-keys M-a C } { new-window -a -c "#{pane_current_path}" }
# The native, local-only session tree. It used to live on `s`; the
# cross-machine picker took that key over (see the tmux-multi block below).
# "time" is not a valid choose-tree sort order (tmux errors "invalid sort
# order"); "activity" is the most-recently-used ordering this wanted.
bind-key M-s choose-tree -sZ -O activity

# after your prefix declaration
# bind-key l next-window
# bind-key h previous-window

# Use terminal settings that match the environment we're running inside.
# VS Code's integrated terminal only understands xterm-256color, while kitty
# (our usual GUI terminal) supports the richer xterm-kitty terminfo. Detect the
# host terminal and adjust so that characters aren't mangled in VS Code.
if-shell '[ "${TERM_PROGRAM}" = "vscode" ]' \
  'set -g default-terminal "xterm-256color"' \
  'set -g default-terminal "xterm-kitty"'
# Advertise truecolor to all terminals tmux runs under
set -ag terminal-overrides ",xterm-256color:RGB"

# Don't eat events that the program should receive (though there is still some issue here)
# unbind -n C-s

set -g allow-passthrough on

# Theme — Tokyo Night (night). Palette reference: docs/tokyonight.md
set -g status-position top
set -g status-style     'bg=#1a1b26,fg=#565f89'

set -g status-left-length  30
set -g status-right-length 80
set -g status-left "#[bg=#1a1b26,fg=#ff9e64] #S  "
# On machines reached over ssh, lead with a green hostname so nested
# (tmux-multi) windows show at a glance which computer they are on.
if-shell '[ -n "$SSH_CONNECTION" ] || [ -n "$SSH_TTY" ]' \
  'set -g status-left "#[bg=#1a1b26,fg=#9ece6a,bold] #h #[fg=#ff9e64,nobold]#S  "'
# The NESTED flag appears while F12 has handed all keys to an inner tmux.
set -g status-right "#{?#{==:#{client_key_table},off},#[fg=#e0af68#,bold]NESTED #[default],}#[fg=#3b4261]#(hostname) "

setw -g window-status-current-format "#[fg=#7aa2f7]#[fg=#7aa2f7,bg=#3b4261]#[reverse]#I #[fg=#7aa2f7,bg=#1a1b26]#W#[default]#[fg=#7aa2f7]"
# set -g status-justify centre

# Pane borders: dim for inactive, primary accent for the focused pane
set -g pane-border-style        'fg=#292e42'
set -g pane-active-border-style 'fg=#7aa2f7'

# Messages and the command prompt
set -g message-style         'bg=#16161e,fg=#e0af68'
set -g message-command-style 'bg=#16161e,fg=#7aa2f7'

# Copy mode: selection matches the terminal's, search matches Tokyo Night's
setw -g mode-style 'bg=#283457,fg=#c0caf5'
setw -g copy-mode-match-style         'bg=#3d59a1,fg=#c0caf5'
setw -g copy-mode-current-match-style 'bg=#ff9e64,fg=#16161e'
setw -g copy-mode-mark-style          'bg=#7aa2f7,fg=#16161e'

# Pane number overlay (prefix + q) and the clock (prefix + t)
set -g display-panes-colour        '#3b4261'
set -g display-panes-active-colour '#ff9e64'
setw -g clock-mode-colour          '#7aa2f7'

# Windows with activity or a bell stand out without shouting
setw -g window-status-activity-style 'fg=#e0af68,bg=#1a1b26,none'
setw -g window-status-bell-style     'fg=#f7768e,bg=#1a1b26,none'

# Improve automatic window naming so panes running a shell show the
# current directory, while other programs keep their command name.
set-option -g allow-rename off
set-window-option -g automatic-rename on
set-window-option -g automatic-rename-format '#(~/.local/bin/tmux-status-name.sh "#{pane_current_path}" "#{pane_current_command}")'

# Remove flags for inactive windows
set-option -g window-status-format " #[fg=#3b4261]#I #[fg=#a9b1d6]#W "
# Remove flags for the current (active) window
# set-option -g window-status-current-format "#I:#W"

# Tmux Plugin Manager (TPM) and plugins
# Double quotes so tmux expands $HOME; a quoted '~' would be stored literally
# and install-tmux-plugins.sh would clone into a directory named '~'.
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins"
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Restore the last session automatically
set -g @continuum-restore 'off'
set -g @continuum-save-interval '15'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-max-pane-history-lines '1000000'
# Restore additional tools that tmux-resurrect does not handle by default.
# The ~tmux-multi entry re-runs the ssh loop for unified remote-session
# windows, so they reconnect after a restore.
set -g @resurrect-processes 'lazygit "~tmux-multi shell-attach"'

# tmux-multi: unified sessions across computers (docs/tmux-multi.md)
# s (and S) open the cross-machine session picker, deliberately replacing the
# native session tree so the everyday key shows every machine's sessions, not
# just this one's. N creates a session on a chosen machine. Both list every
# host in ~/.config/tmux-multi/hosts. M-s keeps the native tree.
# Fullscreen: the preview renders a real pane capture, which needs the room.
bind-key s display-popup -E -w 100% -h 100% "~/.local/bin/tmux-multi pick"
bind-key S display-popup -E -w 100% -h 100% "~/.local/bin/tmux-multi pick"
bind-key N display-popup -E -w 100% -h 100% "~/.local/bin/tmux-multi new"

# Flat view: never show two status bars. When the current window holds a
# remote (tmux-multi) session, this session's own bar hides so the remote
# machine's bar — which lists that machine's windows — is the only one
# visible; selecting a local window brings it back. tmux-multi open sets the
# initial state for freshly created remote windows (the hook would fire
# before the window is tagged).
set-hook -g session-window-changed "set -F status '#{?#{!=:#{@tmux_multi_target},},off,on}'"

# Flat keys: window- and pane-level commands act on the machine you are
# LOOKING at. In a tmux-multi window they forward to the inner tmux (same
# dotfiles, same prefix, on every machine); in a normal window they run
# locally as usual. Session-level keys stay local everywhere: s/S/N
# (picker), d (detach), r (reload), M-s (native tree) — and ']' pastes the
# local buffer into the remote pane, which is cross-machine paste for free.
# The h/j/k/l, </>/C binds above follow the same pattern.
bind-key n if-shell -F '#{!=:#{@tmux_multi_target},}' { send-keys M-a n } { next-window }
bind-key p if-shell -F '#{!=:#{@tmux_multi_target},}' { send-keys M-a p } { previous-window }
bind-key c if-shell -F '#{!=:#{@tmux_multi_target},}' { send-keys M-a c } { new-window }
bind-key x if-shell -F '#{!=:#{@tmux_multi_target},}' { send-keys M-a x } { confirm-before -p "kill-pane #P? (y/n)" kill-pane }
bind-key z if-shell -F '#{!=:#{@tmux_multi_target},}' { send-keys M-a z } { resize-pane -Z }
bind-key w if-shell -F '#{!=:#{@tmux_multi_target},}' { send-keys M-a w } { choose-tree -Zw }
bind-key , if-shell -F '#{!=:#{@tmux_multi_target},}' { send-keys M-a , } { command-prompt -I "#W" { rename-window "%%" } }
bind-key [ if-shell -F '#{!=:#{@tmux_multi_target},}' { send-keys M-a [ } { copy-mode }
bind-key '"' if-shell -F '#{!=:#{@tmux_multi_target},}' { send-keys M-a '"' } { split-window }
bind-key % if-shell -F '#{!=:#{@tmux_multi_target},}' { send-keys M-a % } { split-window -h }
bind-key 0 if-shell -F '#{!=:#{@tmux_multi_target},}' { send-keys M-a 0 } { select-window -t :=0 }
bind-key 1 if-shell -F '#{!=:#{@tmux_multi_target},}' { send-keys M-a 1 } { select-window -t :=1 }
bind-key 2 if-shell -F '#{!=:#{@tmux_multi_target},}' { send-keys M-a 2 } { select-window -t :=2 }
bind-key 3 if-shell -F '#{!=:#{@tmux_multi_target},}' { send-keys M-a 3 } { select-window -t :=3 }
bind-key 4 if-shell -F '#{!=:#{@tmux_multi_target},}' { send-keys M-a 4 } { select-window -t :=4 }
bind-key 5 if-shell -F '#{!=:#{@tmux_multi_target},}' { send-keys M-a 5 } { select-window -t :=5 }
bind-key 6 if-shell -F '#{!=:#{@tmux_multi_target},}' { send-keys M-a 6 } { select-window -t :=6 }
bind-key 7 if-shell -F '#{!=:#{@tmux_multi_target},}' { send-keys M-a 7 } { select-window -t :=7 }
bind-key 8 if-shell -F '#{!=:#{@tmux_multi_target},}' { send-keys M-a 8 } { select-window -t :=8 }
bind-key 9 if-shell -F '#{!=:#{@tmux_multi_target},}' { send-keys M-a 9 } { select-window -t :=9 }

# Nested tmux (a tmux-multi window holds the remote machine's tmux):
# double-tap the prefix to send one prefix to the inner tmux...
bind-key M-a send-prefix
# ...or hit F12 to hand ALL keys to the inner tmux (status dims and shows
# NESTED); F12 again takes them back.
bind-key -n F12 \
  set prefix None \;\
  set key-table off \;\
  set status-style 'bg=#1a1b26,fg=#3b4261' \;\
  refresh-client -S
bind-key -T off F12 \
  set -u prefix \;\
  set -u key-table \;\
  set -u status-style \;\
  refresh-client -S

# Source local overrides if present
if-shell '[ -f ~/.tmux.conf.local ]' 'source-file ~/.tmux.conf.local'

# Pick a URL or file path from the pane via an fzf popup
bind-key O run-shell -b '~/.local/bin/tmux-fzf-url.sh'

# Pick a file path from the pane and copy an rsync download command for it
bind-key u run-shell -b '~/.local/bin/tmux-copy-download-command.sh'

# Initialize TPM (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
