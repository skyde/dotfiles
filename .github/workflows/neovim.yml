name: Neovim Configuration

# The Neovim config is the largest body of code in this repository and, until
# this workflow existed, the only one nothing checked: ~7k lines of Lua with a
# ~560-assertion spec suite that ran only when somebody remembered to.
on:
  push:
    paths:
      - "common/.config/nvim/**"
      - "tests/**"
      - ".github/workflows/neovim.yml"
  pull_request:
    paths:
      - "common/.config/nvim/**"
      - "tests/**"
      - ".github/workflows/neovim.yml"
  workflow_dispatch:

env:
  # The specs and the type check both read this; bump it together with what
  # install-nvim.sh hands people.
  NVIM_VERSION: stable

jobs:
  specs:
    name: Specs (${{ matrix.os }}, ${{ matrix.nvim }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        nvim: [stable]
        include:
          # The floor dotfiles/health.lua claims, tested rather than asserted:
          # it reports an error below this version, and the deprecation shims in
          # util.text and util.vcs_ui exist precisely so the config keeps
          # working this far back. Bump both together or neither.
          - os: ubuntu-latest
            nvim: v0.10.4
          # And the release between the floor and stable. The shims switch
          # behaviour at 0.10, 0.12 and 0.13, so the version in the middle is
          # the one nothing else would exercise.
          - os: ubuntu-latest
            nvim: v0.11.5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.nvim }}

      - name: Report the version under test
        run: nvim --version | head -3

      # Neither runner ships ripgrep, and without it nvim_ripgrep_spec skips the
      # half that matters most: checking util.ripgrep's filetype aliases against
      # the type list of a real `rg`, which is what stops them rotting when
      # ripgrep renames or adds one. The specs skip cleanly without it — that is
      # why this went unnoticed — so install it and let the check run.
      #
      # The same is true of jj and Mercurial, and worse: jj is *first* in the
      # backend detection order, so it is what a colocated repo resolves to.
      # Neither runner ships either one, so both backends' blocks skipped and
      # the code that runs in preference to git was never executed here at all.
      # The Linux legs pin jj so an upstream release cannot turn a green branch
      # red on its own; the macOS leg takes whatever Homebrew has, which is a
      # deliberate second opinion — it is where a jj that changed its output
      # format would show up first.
      - name: Install ripgrep, jj and Mercurial
        env:
          JJ_VERSION: v0.36.0
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install ripgrep jj mercurial
          else
            sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep mercurial
            curl -fsSL "https://github.com/jj-vcs/jj/releases/download/${JJ_VERSION}/jj-${JJ_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
              | sudo tar -xz -C /usr/local/bin ./jj
          fi
          rg --version | head -1
          jj --version
          hg --version | head -1

      # Plugin-free and hermetic otherwise: no network, no ~/.local/share/nvim,
      # no system clipboard. What a spec asserts must not quietly change with
      # what happens to be installed; where it genuinely cannot run, it skips
      # out loud.
      - name: Run the Neovim specs
        env:
          NVIM_CHECKS_NO_SKIP: "1"
        run: ./tests/run-nvim-specs.sh

  # Its own job rather than a matrix leg, so continue-on-error can be a plain
  # true: this is an early warning that the next Neovim release breaks
  # something, and it must never be the reason a branch cannot merge.
  specs-nightly:
    name: Specs (nightly, advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Neovim nightly
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: nightly

      - name: Report the version under test
        run: nvim --version | head -3

      # Same tools as the stable job: an advisory run that silently skips three
      # backends is a weaker early warning than it looks.
      - name: Install ripgrep, jj and Mercurial
        env:
          JJ_VERSION: v0.36.0
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep mercurial
          curl -fsSL "https://github.com/jj-vcs/jj/releases/download/${JJ_VERSION}/jj-${JJ_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | sudo tar -xz -C /usr/local/bin ./jj
          rg --version | head -1
          jj --version
          hg --version | head -1

      - name: Run the Neovim specs
        env:
          NVIM_CHECKS_NO_SKIP: "1"
        run: ./tests/run-nvim-specs.sh

  lint:
    name: Format and types
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ env.NVIM_VERSION }}

      - name: Install StyLua
        uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check --config-path common/.config/nvim/stylua.toml common/.config/nvim tests

      # Pinned, not "latest". Asking the API for the latest tag is an
      # unauthenticated call that gets rate-limited on shared runners — it
      # returned 403, the version came out empty and the download 404'd, which
      # is a red branch caused by nothing in the branch. A pin also stops a new
      # release inventing diagnostics overnight. Bump it deliberately: install
      # the new version locally, run this script, then change the number.
      - name: Install lua-language-server
        env:
          LLS_VERSION: 3.19.0
        run: |
          curl -fsSL -o lls.tar.gz \
            "https://github.com/LuaLS/lua-language-server/releases/download/${LLS_VERSION}/lua-language-server-${LLS_VERSION}-linux-x64.tar.gz"
          mkdir -p "$HOME/lls"
          tar xzf lls.tar.gz -C "$HOME/lls"
          echo "$HOME/lls/bin" >> "$GITHUB_PATH"

      # Undefined globals, calls with the wrong arity, values used without a
      # nil check, and anything Neovim has deprecated — the class of mistake a
      # spec only finds if it happens to take that branch.
      - name: Type-check the Lua
        env:
          NVIM_CHECKS_NO_SKIP: "1"
        run: ./tests/check-nvim-types.sh

  integration:
    name: Against the installed config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ env.NVIM_VERSION }}

      # Unlike the specs, these two drive the config as actually assembled —
      # LazyVim, the plugin set, the colorscheme — so the plugins have to be
      # there. Restored from lazy-lock.json, so a plugin's upstream moving
      # cannot turn a green branch red on its own.
      - name: Install the plugins at the pinned commits
        run: |
          mkdir -p "$HOME/.config"
          ln -s "$PWD/common/.config/nvim" "$HOME/.config/nvim"
          nvim --headless "+Lazy! restore" +qa

          # A spec that names a branch and no commit is not pinned by the
          # lockfile at all: lazy.nvim follows the branch and rewrites the
          # entry. LazyVim does exactly that for nvim-treesitter on Neovim
          # 0.12+ (`commit = ... or nil` in its spec), so a cold restore moves
          # it to the branch tip every time. Worth saying out loud — it means
          # this job did not run against the commit the lockfile names — but it
          # is upstream's choice, not something a change here can fix, so it is
          # not a failure. Put the file back so nothing downstream sees a dirty
          # tree.
          if ! git diff --quiet -- common/.config/nvim/lazy-lock.json; then
            echo "::warning::lazy-lock.json was rewritten by :Lazy restore; these plugins are branch-tracked, not pinned"
            git diff -- common/.config/nvim/lazy-lock.json
            git checkout -- common/.config/nvim/lazy-lock.json
          fi

      # The syntax-role check skips itself when the parsers are missing, so
      # assert they landed rather than letting the job go green having checked
      # nothing.
      - name: Install the tree-sitter parsers the syntax check needs
        run: |
          nvim --headless \
            -c 'lua require("nvim-treesitter").install({ "c", "cpp", "python", "lua" }):wait(300000)' \
            -c qa
          missing=()
          for parser in c cpp python lua; do
            compgen -G "$HOME/.local/share/nvim/**/parser/$parser.so" >/dev/null || missing+=("$parser")
          done
          if (( ${#missing[@]} )); then
            echo "❌ parsers did not install: ${missing[*]}" >&2
            exit 1
          fi
          echo "✅ parsers installed: c cpp python lua"
        shell: bash -O globstar -eo pipefail {0}

      # Invokes every parity binding against the real config and reports
      # anything that raises.
      - name: Invoke every keymap
        run: ./tests/check-nvim-keymaps.sh

      # C++ and Python must colour the same construct the same way.
      - name: Check syntax role parity
        run: ./tests/check-nvim-syntax-roles.sh

      # Drives Shift+Fn through a real terminal into a real Neovim. Belongs
      # here rather than with the specs: the keys it looks for are registered
      # from config/keymaps.lua on VeryLazy, which needs LazyVim installed —
      # without the plugins every one of them reads as "not mapped".
      - name: Check footpedal key transport
        run: python3 tests/check-footpedal-keys.py

      # Same idea as the startup cost below, for the view this config is
      # actually about: how long a big listing takes to appear, and how it
      # scrubs once it is up. Informational — a shared runner cannot be
      # budgeted against — but a regression shows up here.
      - name: Report changed-files view cost
        run: ./tests/bench-nvim-vcs.sh 3000

      - name: Report startup cost
        run: |
          # Informational, not a gate: a shared CI runner is far too noisy to
          # budget against. It is here so a regression is visible in the log.
          for i in 1 2 3 4 5; do
            nvim --headless --startuptime "startup.$i" +qa >/dev/null 2>&1
            tail -1 "startup.$i" | awk '{ printf "run %d: %s ms\n", '"$i"', $1 }'
          done
