name: Theme Consistency

# The Tokyo Night theme is spread across a dozen configs in four syntaxes, and
# nothing in any of them refers to any other. This is what stops the copies
# drifting apart between the times someone remembers to look.
#
# Triggered on the theme files themselves and on the palette doc, because
# tests/check-theme.py treats that doc as the source of truth: it reads the
# "Where the theme lives" table to decide what to scan, and a colour the doc
# does not name is a failure wherever it appears.

#
# The two path lists below are duplicated rather than shared through a YAML
# anchor: GitHub Actions' workflow parser does not expand anchors, and the
# repo's other workflows spell theirs out for the same reason. Keep them equal.

on:
  push:
    paths:
      - "docs/tokyonight.md"
      - "tests/check-theme.py"
      - "tests/check-theme-selftest.py"
      - "docs/vscode-syntax-parity.md"
      - "common/.tmux.conf"
      - "common/.zshrc"
      - "common/.zshenv"
      - "common/.bashrc-custom"
      - "common/.ripgreprc"
      - "common/.config/**"
      - ".github/workflows/theme-consistency.yml"
  pull_request:
    paths:
      - "docs/tokyonight.md"
      - "tests/check-theme.py"
      - "tests/check-theme-selftest.py"
      - "docs/vscode-syntax-parity.md"
      - "common/.tmux.conf"
      - "common/.zshrc"
      - "common/.zshenv"
      - "common/.bashrc-custom"
      - "common/.ripgreprc"
      - "common/.config/**"
      - ".github/workflows/theme-consistency.yml"
  workflow_dispatch:

jobs:
  theme:
    name: Palette, parity and contrast
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The only dependency, and it earns its 3 seconds: theme.sh is sourced by
      # zsh on every shell, and the two shells disagree in ways that are
      # invisible from bash -- `$var:s` is a history modifier in zsh, so text
      # that is unremarkable to bash can be a parse error there. The check
      # sources the file in both and compares what comes out, but only if zsh
      # is actually present, so without this step it would quietly skip the
      # half that matters most.
      - name: Install zsh
        run: sudo apt-get install -y --no-install-recommends zsh

      # delta is the oracle for its own option names: it rejects an unknown
      # flag, and a git config section otherwise accepts any key you write in
      # it, so a name that is subtly wrong is a setting that silently never
      # applies. Not fatal if the package is unavailable — the check skips
      # itself when delta is missing, which is worse than running it but better
      # than failing the build over an apt mirror.
      - name: Install delta
        run: sudo apt-get install -y --no-install-recommends git-delta
          || echo "git-delta unavailable; delta option check will skip"

      # yazi is the only tool here that can be asked whether it *accepted* its
      # config rather than merely parsed as TOML, and it is the one where the
      # answer has been "no" for three files at once. Not fatal if the download
      # fails -- the check skips itself when yazi is missing.
      - name: Install yazi
        run: |
          set -o pipefail
          url=https://github.com/sxyazi/yazi/releases/latest/download/yazi-x86_64-unknown-linux-gnu.zip
          if curl -fsSL -o /tmp/yazi.zip "$url"; then
            unzip -qo /tmp/yazi.zip -d /tmp/yazi
            sudo install -m755 /tmp/yazi/*/yazi /usr/local/bin/yazi
            yazi --version
          else
            echo "yazi unavailable; its config check will skip"
          fi

      - name: Install starship
        run: |
          curl -fsSL https://starship.rs/install.sh | sh -s -- -y -b /usr/local/bin \
            || echo "starship unavailable; its config check will skip"

      - name: Install bat
        run: sudo apt-get install -y --no-install-recommends bat
          || echo "bat unavailable; the BAT_THEME check will only compare the two shells"

      # tmux accepts an option name by unambiguous prefix and drops an
      # unknown one without a word, so "the config loaded" says nothing. The
      # check starts a server on its own socket and asks what it holds.
      - name: Install tmux
        run: sudo apt-get install -y --no-install-recommends tmux
          || echo "tmux unavailable; its option check will skip"

      - name: Install kitty
        run: sudo apt-get install -y --no-install-recommends kitty
          || echo "kitty unavailable; its config check will skip"

      # wezterm is the strictest of the config oracles — its Lua has to convert
      # into a Rust struct, so an unparseable colour is a hard error naming the
      # key. Worth the download; not fatal if it fails.
      - name: Install wezterm
        run: |
          url=https://github.com/wez/wezterm/releases/download/20240203-110809-5046fc22/wezterm-20240203-110809-5046fc22.Ubuntu22.04.deb
          if curl -fsSL -o /tmp/wezterm.deb "$url"; then
            sudo dpkg -i /tmp/wezterm.deb || sudo apt-get -y -f install
            wezterm --version
          else
            echo "wezterm unavailable; its config check will skip"
          fi

      - name: Check the theme
        run: tests/check-theme.py --verbose

      # A checker that never fails is indistinguishable from a checker that is
      # broken. This breaks one specific thing in a copy of the tree, once per
      # mutation, and requires the checker to notice each one and say why.
      - name: Check the checker
        run: tests/check-theme-selftest.py --verbose
