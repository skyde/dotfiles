name: Script Validation and Syntax Checking

on:
  push:
    # common/.local/bin and lib hold most of the shell in this repo and almost
    # none of it is named *.sh, so an "**.sh" filter never fired for them —
    # editing st, si, osc-copy or git-copy ran no validation at all.
    paths:
      - "**.sh"
      - "**.ps1"
      - "common/.local/bin/**"
      - "lib/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "**.sh"
      - "**.ps1"
      - "common/.local/bin/**"
      - "lib/**"
      - ".github/workflows/**"
  workflow_dispatch:

jobs:
  shellcheck:
    name: ShellCheck Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: |
          sudo apt update
          sudo apt install -y shellcheck

      - name: Run ShellCheck on shell scripts
        run: |
          echo "🔍 Running ShellCheck analysis..."

          # Select by shebang, not by extension. Matching "*.sh" skipped 24 of
          # the repo's 50 shell scripts, including every tool in
          # common/.local/bin — st, si, ff, osc-copy, git-copy and the rest,
          # which is where most of the shell actually lives.
          #
          # Sourced rc files have no shebang and were missed by both spellings,
          # so .bashrc-custom went unchecked entirely. They declare their shell
          # to shellcheck in a directive on the first line instead; take that as
          # the signal. zsh is excluded because shellcheck cannot parse it —
          # .zshrc's glob qualifiers are a syntax error to it.
          mapfile -t scripts < <(
            git ls-files | while IFS= read -r f; do
              [ -f "$f" ] || continue
              first="$(head -n 1 "$f")"
              case "$first" in
                '#!'*bash*|'#!'*/sh|'#!'*env\ sh) printf '%s\n' "$f" ;;
                '# shellcheck shell='sh|'# shellcheck shell='bash|'# shellcheck shell='dash|'# shellcheck shell='ksh)
                  printf '%s\n' "$f" ;;
              esac
            done
          )

          printf 'Checking %d shell scripts:\n' "${#scripts[@]}"
          printf '  %s\n' "${scripts[@]}"

          # --severity=warning, not error: the repo is clean at this level, so
          # anything new stands out instead of accumulating below the bar.
          if shellcheck --severity=warning "${scripts[@]}"; then
            echo "✅ All shell scripts passed ShellCheck"
          else
            echo "❌ ShellCheck reported problems"
            exit 1
          fi

  powershell-validation:
    name: PowerShell Script Validation
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate PowerShell scripts
        run: |
          Write-Host "🔍 Validating PowerShell scripts..."

          $scripts = Get-ChildItem -Path . -Filter "*.ps1" -Recurse
          $failed = $false

          foreach ($script in $scripts) {
            Write-Host "Validating: $($script.Name)"
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $script.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null

            if ($errors.Count -eq 0) {
              Write-Host "✅ $($script.Name) syntax is valid"
            } else {
              Write-Host "❌ $($script.Name) has syntax errors: $($errors -join '; ')"
              $failed = $true
            }
          }

          if ($failed) {
            exit 1
          }

          Write-Host "✅ All PowerShell scripts passed validation"
        shell: pwsh

  cross-script-compatibility:
    name: Cross-Script Compatibility Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check script compatibility
        run: |
          echo "🔍 Checking cross-script compatibility..."

          # Check if shell and PowerShell scripts have matching functionality
          shell_scripts=("init.sh" "apply.sh" "update.sh")
          ps_scripts=("init.ps1" "apply.ps1" "update.ps1")

          for i in "${!shell_scripts[@]}"; do
            shell_script="${shell_scripts[$i]}"
            ps_script="${ps_scripts[$i]}"
            
            echo "Comparing $shell_script and $ps_script..."
            
            # Check if both files exist
            if [[ ! -f "$shell_script" ]]; then
              echo "❌ $shell_script missing"
              exit 1
            fi
            
            if [[ ! -f "$ps_script" ]]; then
              echo "❌ $ps_script missing"
              exit 1
            fi
            
            # Check for key functionality markers
            if grep -q "AUTO_INSTALL" "$shell_script" && grep -q "AUTO_INSTALL" "$ps_script"; then
              echo "✅ Both scripts support AUTO_INSTALL"
            else
              echo "⚠️ AUTO_INSTALL support mismatch"
            fi
            
            # Check for error handling
            if grep -q "set -e" "$shell_script" && grep -q "ErrorActionPreference" "$ps_script"; then
              echo "✅ Both scripts have error handling"
            else
              echo "⚠️ Error handling mismatch"
            fi
          done

          echo "✅ Cross-script compatibility check completed"

  documentation-sync:
    name: Documentation Synchronization Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check documentation accuracy
        run: |
          echo "📚 Checking documentation accuracy..."

          # Verify expected package directories exist
          for dir in common mac windows; do
            if [ -d "$dir" ]; then
              echo "  Found $dir"
            else
              echo "❌ Missing expected directory: $dir"
              exit 1
            fi
          done

          # Check VS Code extensions count
          vscode_count=$(grep -vcE '^(#|$)' vscode_extensions.txt)
          echo "  VS Code extensions: $vscode_count"

          # Verify script documentation exists (in README.md or README-usage.md)
          if (grep -q "init.ps1" README.md README-usage.md) && (grep -q "apply.ps1" README.md README-usage.md) && (grep -q "update.ps1" README.md README-usage.md); then
            echo "✅ PowerShell scripts are documented"
          else
            echo "❌ PowerShell script documentation missing"
            exit 1
          fi

          if (grep -q "init.sh" README.md README-usage.md) && (grep -q "apply.sh" README.md README-usage.md) && (grep -q "update.sh" README.md README-usage.md); then
            echo "✅ Shell scripts are documented"
          else
            echo "❌ Shell script documentation missing"
            exit 1
          fi

          # Check for old references
          if grep -q "install.ps1\|install.sh" README.md; then
            echo "❌ README contains references to old install scripts"
            exit 1
          fi

          echo "✅ Documentation is up to date"
